name: Windows regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell regression checks
        shell: powershell
        run: ./tests/Test-Core.ps1
      - name: Verify release packaging
        shell: powershell
        run: ./scripts/Build-Release.ps1
